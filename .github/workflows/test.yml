name: test

on:
  push:
  pull_request:

jobs:
  unit:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - name: Syntax check
        run: node --check lib/index.js && node --check lib/safety-core.mjs && node --check lib/client.js
      - name: Unit tests (zero-dependency)
        run: node --test test/safety.test.mjs
