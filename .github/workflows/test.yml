name: test

on:
  push:
    # The self-diagnosis step pushes failure logs to the `ci-logs` branch;
    # that push must not re-trigger this workflow (infinite loop).
    branches-ignore:
      - 'ci-logs'
  pull_request:

jobs:
  unit:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    strategy:
      matrix:
        node-version: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - name: Syntax check (capture output)
        run: |
          set +e
          npm run check 2>&1 | tee /tmp/ci-step.txt
          code=${PIPESTATUS[0]}
          if [ $code -ne 0 ]; then
            cp /tmp/ci-step.txt "$GITHUB_WORKSPACE/ci-failure.txt"
            echo "syntax check failed — full output saved to ci-failure.txt (see next step)"
            exit $code
          fi
      - name: Unit tests (capture output)
        run: |
          set +e
          # tee keeps the full test output visible in this step's log AND in
          # the file pushed to ci-logs on failure.
          npm test 2>&1 | tee /tmp/full-test-output.txt
          code=${PIPESTATUS[0]}
          if [ $code -ne 0 ]; then
            cp /tmp/full-test-output.txt "$GITHUB_WORKSPACE/ci-failure.txt"
            echo "tests failed — full output saved to ci-failure.txt (see next step)"
            exit $code
          fi
      - name: Integration harness (capture output)
        run: |
          set +e
          node test/harness.mjs 2>&1 | tee /tmp/harness-output.txt
          code=${PIPESTATUS[0]}
          if [ $code -ne 0 ]; then
            cp /tmp/harness-output.txt "$GITHUB_WORKSPACE/ci-failure.txt"
            echo "harness failed — full output saved to ci-failure.txt (see next step)"
            exit $code
          fi
      - name: Publish failure log to ci-logs branch
        # MUST be the LAST step: it only runs after every check/test/harness
        # step has had its chance to write ci-failure.txt (a failure in any of
        # them is then reported here).
        if: failure() && hashFiles('ci-failure.txt') != ''
        run: |
          git config user.name "dsh-safety-ci"
          git config user.email "ci@dsh-safety.local"
          git checkout -b ci-logs
          git add ci-failure.txt
          git commit -m "ci: test failure log $(date -u +%Y%m%d-%H%M%S)"
          git push "https://x-access-token:${GITHUB_TOKEN}@github.com/sugarxl/dsh-safety.git" ci-logs -f
